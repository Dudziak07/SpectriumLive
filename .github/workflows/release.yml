name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build & Publish Release (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore cached NuGet packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish Windows x64 Application
        run: >-
          dotnet publish SpectriumLive.Wpf/SpectriumLive.Wpf.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output ./publish

      - name: Package Release Archive & Compute Checksum
        shell: pwsh
        run: |
          Rename-Item -Path "./publish/SpectriumLive.Wpf.exe" -NewName "SpectriumLive.exe"
          tar.exe -a -c -f SpectriumLive-win-x64.zip -C ./publish SpectriumLive.exe
          $hash = (Get-FileHash -Path SpectriumLive-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  SpectriumLive-win-x64.zip" | Out-File -FilePath SpectriumLive-win-x64.zip.sha256 -Encoding ascii
          Write-Host "Built SpectriumLive-win-x64.zip with SHA-256: $hash"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpectriumLive-win-x64
          path: |
            SpectriumLive-win-x64.zip
            SpectriumLive-win-x64.zip.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            SpectriumLive-win-x64.zip \
            SpectriumLive-win-x64.zip.sha256 \
            --title "Release $TAG_NAME" \
            --generate-notes
