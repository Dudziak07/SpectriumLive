name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore SpectriumLive.sln

      - name: Scan NuGet Dependencies for Vulnerabilities
        run: dotnet list SpectriumLive.sln package --vulnerable --include-transitive

      - name: Build solution
        run: dotnet build SpectriumLive.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test SpectriumLive.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage"

      - name: Publish Test Summary
        if: success() || failure()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.4
        with:
          paths: 'tests/**/TestResults/*.trx'

      - name: Publish Code Coverage Summary
        if: success() || failure()
        shell: pwsh
        run: |
          $covFiles = Get-ChildItem -Recurse -Filter "coverage.cobertura.xml" tests -ErrorAction SilentlyContinue
          if (-not $covFiles) {
            Write-Host "No coverage.cobertura.xml file found."
            exit 0
          }
          [xml]$cov = Get-Content $covFiles[0].FullName
          $lineRate = [math]::Round([double]$cov.coverage.'line-rate' * 100, 2)
          $branchRate = [math]::Round([double]$cov.coverage.'branch-rate' * 100, 2)
          $linesCovered = $cov.coverage.'lines-covered'
          $linesValid = $cov.coverage.'lines-valid'
          $branchesCovered = $cov.coverage.'branches-covered'
          $branchesValid = $cov.coverage.'branches-valid'

          $summary = @"
          ### 📊 Code Coverage Summary

          | Metric | Coverage | Details |
          | :--- | :--- | :--- |
          | **Line Coverage** | **$lineRate%** | $linesCovered / $linesValid lines |
          | **Branch Coverage** | **$branchRate%** | $branchesCovered / $branchesValid branches |

          <details>
          <summary><b>Coverage by Package</b></summary>

          | Package | Line Coverage | Branch Coverage |
          | :--- | :--- | :--- |
          "@

          foreach ($pkg in $cov.coverage.packages.package) {
            $pkgLine = [math]::Round([double]$pkg.'line-rate' * 100, 2)
            $pkgBranch = [math]::Round([double]$pkg.'branch-rate' * 100, 2)
            $summary += "`n| ``$($pkg.name)`` | $pkgLine% | $pkgBranch% |"
          }

          $summary += "`n`n</details>"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Code Coverage Report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-coverage-report
          path: tests/**/TestResults/**/coverage.cobertura.xml
          retention-days: 14
