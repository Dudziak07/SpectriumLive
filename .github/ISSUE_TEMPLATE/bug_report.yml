name: Bug Report
description: Create a report to help us improve SpectriumLive.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much relevant detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start the application
        2. Select camera '...'
        3. Apply filter '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - Windows 11 (ARM64)
        - Other
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: SpectriumLive Version
      description: Which version or release tag are you running (e.g. v1.2.0)?
      placeholder: "v1.2.0"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context / Logs
      description: Add any camera model info, crash logs, or screenshots here.
